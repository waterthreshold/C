<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
}

/* Table layout = best compatibility */
.cover-table {
    display: table;
    width: 100%;
    height: 100vh;
}

.cover-cell {
    display: table-cell;
    text-align: center;
    vertical-align: middle;
}

h1 {
    font-size: 48px;
    margin-bottom: 20px;
}

h2 {
    font-size: 24px;
    color: #555;
}

.meta {
    margin-top: 60px;
    font-size: 16px;
    color: #777;
}
</style>
</head>

<body>
<div class="cover-table">
    <div class="cover-cell">
		<img src="{{ logo_path }}" style="margin-bottom:40px;">
        <h1>{{ title }}</h1>
        <h2>{{ subtitle }}</h2>

        <div class="meta">
            <p><strong>Author:</strong> {{ author }}</p>
            <p><strong>Date:</strong> {{ date }}</p>
            <p><strong>Version:</strong> {{ version }}</p>
        </div>
    </div>
</div>
</body>
</html>
