<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body {
    font-family: Arial, sans-serif;
    margin: 40px;
}

h1 {
    border-bottom: 2px solid #333;
    padding-bottom: 5px;
}

h2 {
    margin-top: 25px;
    color: #444;
}

.section {
    margin-top: 20px;
}

table {
    border-collapse: collapse;
    width: 100%;
}

table, th, td {
    border: 1px solid #aaa;
}

th, td {
    padding: 8px;
}

img {
    max-width: 500px;
}
</style>
</head>

<body>

<h1>Summary</h1>
<div class="section">
    <p>Folloing HW stress test guideline V1.0 GROUP A testing</p>
</div>

<h1>Measurements</h1>
<table>
    <tr>
        <th>Name</th>
        <th>Value</th>
    </tr>
    
    <tr>
        <td>Temperature</td>
        <td>36.5 C</td>
    </tr>
    
    <tr>
        <td>Pressure</td>
        <td>1 atm</td>
    </tr>
    
    <tr>
        <td>Humidity</td>
        <td>60%</td>
    </tr>
    
</table>

<h1>Result Image</h1>
<div class="section">
    <img src="output.png">
</div>

<h1>Conclusion</h1>
<div class="section">
    <p>All tests passed successfully.</p>
</div>

</body>
</html>
