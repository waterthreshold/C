<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body {
    font-family: Arial, sans-serif;
    margin: 40px;
}

h1 {
    border-bottom: 2px solid #333;
    padding-bottom: 5px;
}

h2 {
    margin-top: 25px;
    color: #444;
}

.section {
    margin-top: 20px;
}

table {
    border-collapse: collapse;
    width: 100%;
}

table, th, td {
    border: 1px solid #aaa;
}

th, td {
    padding: 8px;
}

img {
    max-width: 500px;
}
</style>
</head>

<body>

<h1>Summary</h1>
<div class="section">
    <p>{{ summary }}</p>
</div>

<h1>Measurements</h1>
<table>
    <tr>
        <th>Name</th>
        <th>Value</th>
    </tr>
    {% for item in items %}
    <tr>
        <td>{{ item.name }}</td>
        <td>{{ item.value }}</td>
    </tr>
    {% endfor %}
</table>

<h1>Result Image</h1>
<div class="section">
    <img src="{{ image_path }}">
</div>

<h1>Conclusion</h1>
<div class="section">
    <p>{{ conclusion }}</p>
</div>

</body>
</html>
