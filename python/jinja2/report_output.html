<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Test Report</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        h1, h2, h3 {
            margin: 0;
        }

        /* Cover Page */
        .cover {
           // height: 90vh;
			//display: flex;
			flex-direction: column;
			//justify-content: center;
			align-items: center;
			text-align: center;
			padding-top: 200px;
        }

	.cover-table {
			display: table;
			width: 100%;
			height: 100%;
		}
		
		.cover-cell {
			display: table-cell;
			text-align: center;
			vertical-align: middle;
		}
        .cover h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .cover h2 {
            font-size: 24px;
            color: #555;
        }

        .cover .meta {
            margin-top: 80px;
            font-size: 16px;
            color: #777;
        }

        /* Page Break */
        .page-break {
            page-break-after: always;
        }

        /* Content */
        .section {
            margin-top: 30px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        table, th, td {
            border: 1px solid #aaa;
        }

        th, td {
            padding: 8px;
        }

        img {
            max-width: 500px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>

<!-- COVER PAGE -->
<div class="cover">
	<img src="logo.png" style="margin-bottom:40px;">
    <h1>Test Report</h1>
    <h2>HW Stress Test Report</h2>
	
	
	
    <div class="meta">
        <p><strong>Author:</strong> Jeff Chiang</p>
        <p><strong>Date:</strong> 2026-04-27 15:07:42</p>
        <p><strong>Version:</strong> v1.0</p>
    </div>
</div>

<div class="page-break"></div>

<!-- MAIN CONTENT -->
<h1>Test Report</h1>

<div class="section">
    <h2>Summary</h2>
    <p>This is a sample generated report.</p>
</div>

<div class="section">
    <h2>Data Table</h2>
    <table>
        <tr>
            <th>Name</th>
            <th>Value</th>
        </tr>
        
        <tr>
            <td>Temperature</td>
            <td>36.5 C</td>
        </tr>
        
        <tr>
            <td>Pressure</td>
            <td>1 atm</td>
        </tr>
        
        <tr>
            <td>Humidity</td>
            <td>60%</td>
        </tr>
        
    </table>
</div>

<div class="section">
    <h2>Result Image</h2>
    <img src="output.png">
</div>

</body>
</html>
