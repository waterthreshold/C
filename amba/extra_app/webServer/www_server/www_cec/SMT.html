<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test Results</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f8f9fa;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px;
    }

    h2 {
      margin-bottom: 20px;
      color: #333;
    }

    .test-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 16px;
      width: 100%;
      max-width: 800px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: transform 0.2s;
    }

    .card:hover {
      transform: translateY(-3px);
    }

    .test-name {
      font-size: 16px;
      font-weight: 500;
      color: #444;
    }

    .status {
      font-size: 14px;
      font-weight: bold;
      padding: 6px 12px;
      border-radius: 20px;
      text-transform: uppercase;
    }

    .pass {
      background-color: #e6f9ed;
      color: #1a7f37;
      border: 1px solid #1a7f37;
    }

    .fail {
      background-color: #fdecea;
      color: #d93025;
      border: 1px solid #d93025;
    }
  </style>
</head>
<body>
  <h2>Test Results</h2>

  <div class="test-list">
    <div class="card">
      <span class="test-name">Network Connectivity</span>
      <span class="status pass">PASS</span>
    </div>
    <div class="card">
      <span class="test-name">Storage Check</span>
      <span class="status fail">FAIL</span>
    </div>
    <div class="card">
      <span class="test-name">Camera Module</span>
      <span class="status">PASS</span>
    </div>
    <div class="card">
      <span class="test-name">Sensor Calibration</span>
      <span class="status"></span>
    </div>
  </div>
</body>
</html>
