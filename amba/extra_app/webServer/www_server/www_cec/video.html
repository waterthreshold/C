<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live View</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f4f4;
      text-align: center;
    }

    .video-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 15px;
    }

    #Main_video {
      width: 80%;
      max-width: 800px;
      height: auto;
      border: 3px solid #333;
      border-radius: 10px;
      background: #000;
    }

    .controls {
      margin: 10px auto;
      display: flex;
      justify-content: center;
      gap: 15px;
    }

    select, button {
      padding: 8px 12px;
      font-size: 15px;
      border-radius: 5px;
      border: 1px solid #ccc;
      cursor: pointer;
    }

    button {
      background: #007bff;
      color: #fff;
      border: none;
      transition: background 0.3s;
    }

    button:hover {
      background: #0056b3;
    }
  </style>
<link rel="icon" href="asset/img/favicon.ico" type="image/x-icon">
</head>
<body>
  <!-- Replace the src with your MJPEG stream URL -->
<div class="video-container">
    <img src="http://172.16.7.60:8080" id="Main_video" alt="MJPEG Stream">
  </div>

  <div class="controls">
    <div>
      <label for="cams">Camera:</label>
      <select name="cams" id="cams" onchange="cameraOnChange(this.value)">
        <option value="A">A</option>
        <option value="B">B</option>
        <option value="C">C</option>
        <option value="D">D</option>
      </select>
    </div>
    <div>
      <button onclick="openImagePopup()">📷 Capture</button>
    </div>
  </div>
</body>

<script>
function init() {
    var ipAddress = window.location.host;
    console.log(ipAddress);
	document.getElementById("Main_video").src = "http://" + ipAddress + ":8080";
    setInterval(function (oldip) {
        var newIpAddress = window.location.host;
        if (newIpAddress !== oldip) {
            ipAddress = newIpAddress;
        }

        document.getElementById("Main_video").src = "http://" + ipAddress + ":8080";
        console.log("http://" + ipAddress + ":8080");
    }, 30000, ipAddress);
	
	const img = document.getElementById("Main_video");

	img.addEventListener("click", function () {
    if (this.requestFullscreen) {
      this.requestFullscreen();
    } else if (this.webkitRequestFullscreen) { // Safari
      this.webkitRequestFullscreen();
    } else if (this.msRequestFullscreen) { // IE11
      this.msRequestFullscreen();
    }
  });
}

function SelectedCamera(camera){
	
	switch (camera) {
	  case "A":
		document.getElementById("cams").value = camera
		break;
	  case "B":
		document.getElementById("cams").value = camera
		break;
	  case "C":
		document.getElementById("cams").value = camera
		break;
	  case "D":
		document.getElementById("cams").value = camera
		break;
	  default:
		console.log("Unknown cams");
	}
}

function GetCamerea(){
	 fetch('/cgi-bin/GetCamera.cgi')
        .then(response => response.text())
        .then(data => {
            console.log("Response:", data);
            //alert(data); // show CGI output -->
			let obj = {};
			data.split("&").forEach(p => {
			  let [key, value] = p.split("=");
			  obj[key] = value;
			});
			SelectedCamera(obj['Camera'])
        })
        .catch(err => console.error(err));
}

function cameraOnChange(val) {
	 fetch('/cgi-bin/SetCamera.cgi?Camera='+val)
        .then(response => response.text())
        .then(data => {
            console.log("Response:", data);
            //alert(data); // show CGI output -->
			init()
        })
        .catch(err => console.error(err));
	
}

function openImagePopup() {
	// Image URL — can be your /tmp image via HTTP server
	let imgUrl = "/tmp/screenshot.jpg";

	// Open a small popup window
	let popup = window.open("", "ImagePopup", "width=800,height=600");

	// Write image into popup
	popup.document.write(`
		<html>
		<head><title>Image Screenshot</title></head>
		<body style="margin:0; padding:0; text-align:center; background-color:black;">
			<div>
				<img src="/cgi-bin/GetScreenshot.cgi" style="max-width:100%; height:auto;">
			</div>
			<br>
			<div>
				<div>
					<a href="/cgi-bin/GetScreenshot.cgi" download="screenshot.jpg" style="background:#4CAF50; color:white; padding:10px 20px; text-decoration:none; border-radius:5px; font-size:16px;">
								Save Image
					</a>
				</div>
				<br>
				<br>
				<div>
					<a href="javascript:void(0)"
					   style="background:#AD1822; color:white; padding:10px 20px; text-decoration:none; border-radius:5px; font-size:16px;"
					   onclick="window.close()">
						Close
					</a>
				</div>
			</div>
		</body>
		</html>
	`);
}
	document.addEventListener("DOMContentLoaded", init);
	document.addEventListener("DOMContentLoaded", GetCamerea);
</script>
</html>
